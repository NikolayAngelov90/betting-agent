name: Paper Trading Report

# Stage 11 — the experiment's instrument, on a schedule.
#
# WHY THIS EXISTS
#
# Stages 5-10 built the whole prospective CLV experiment and Stage 10.1 found
# that nothing ever ran the report. Collected data nobody looks at is not
# evidence; without this the MODEL/FINAL series, the coverage figures and the
# 100/200/500 checkpoints would only ever be seen if someone ran the script by
# hand.
#
# WHEN
#
# After the day's data is complete, not before:
#
#   09:37 UTC  daily-picks   — settles yesterday's matches, then generates today's
#   11:17 UTC  closing-lines — first capture slot of the day
#   ...        closing-lines — every 2h through 23:17 UTC
#   10:47 UTC  THIS JOB      — after settlement, before the first capture
#
# Running between the daily pipeline and the first capture means the report
# always describes a settled, quiet state rather than one mid-write. It is a
# running summary of the whole experiment, so it does not need to wait for
# today's picks to reach kickoff.
#
# COST
#
# Zero Odds API credits: this job never touches the provider. It reads the
# database and prints. It is strictly READ-ONLY — no pick is written, settled or
# captured here, and no ODDS_API_KEY is provided to it, so it cannot spend even
# by accident.

on:
  schedule:
    # 10:47 UTC (13:47 Sofia). Off-hour minute to dodge scheduler congestion;
    # ~70 min after daily-picks starts, ~30 min before the first capture.
    - cron: '47 10 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        default: '120'
      model_version:
        description: 'Restrict to one frozen cohort (blank = all, with a breakdown)'
        default: ''

concurrency:
  # Never two reports at once. Queue rather than cancel — a report that starts
  # is cheap and finishing it costs nothing.
  group: paper-trading-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # Minimal: this job reads the database and computes statistics. It never
        # trains, scrapes or calls an API.
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary pyyaml python-dotenv loguru numpy scipy

      - name: Create directories
        run: mkdir -p data/models logs

      - name: Create config from example
        # config.example.yaml is the authoritative production configuration
        # (Stage 10.2). config/config.yaml is gitignored and never deployed.
        run: cp config/config.example.yaml config/config.yaml

      - name: Report frozen model identity
        env:
          BETTING_AGENT_ALLOW_DEFAULT_HMAC: '1'
        run: |
          python - <<'EOF'
          from src.utils.config import Config
          from src.models.model_version import model_version, CODE_REVISION
          cfg = Config("config/config.example.yaml")
          print(f"CODE_REVISION = {CODE_REVISION}")
          print(f"model_version = {model_version(cfg)}")
          EOF

      - name: Paper trading report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTING_AGENT_ALLOW_DEFAULT_HMAC: '1'
          TABLES_CREATED: '1'
        run: |
          DAYS="${{ inputs.days }}"
          MV="${{ inputs.model_version }}"
          ARGS="--days ${DAYS:-120} --include-live"
          if [ -n "$MV" ]; then ARGS="$ARGS --model-version $MV"; fi
          python -m scripts.paper_trading_report $ARGS | tee logs/paper-trading-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-report-${{ github.run_number }}
          path: logs/paper-trading-report.txt
          retention-days: 30

      - name: Alert if the report failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.ci_alert             "⚠️ Paper trading report failed. The experiment is still collecting, but its instrument is blind today. Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
