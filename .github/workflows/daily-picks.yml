name: Daily Betting Picks

on:
  schedule:
    # One daily run. The WC (which forced a 16:00-UTC kickoff deadline and a
    # second "backup" cron to survive GitHub's 0.5-5.7h scheduler delays, a figure
    # from the RETIRED pre-08-30 regime) is
    # over; club matches kick off in the evening, hours after this ~11:00-UTC
    # run finishes even when the scheduler is late — so a single run has ample
    # buffer and the backup cron was removed (2026-07-22). Off-hour minute
    # dodges top-of-hour congestion. Manual re-runs available via dispatch.
    # STAGE 21. 09:37 -> 03:00 UTC (06:00 Sofia).
    #
    # 09:37 was already near-optimal for a ZERO-delay world: the earliest
    # kickoff in the active league set is 10:04 UTC (Sunday p05 = 10:06), and a
    # ~20-minute run starting at 09:37 finishes before it. The problem was never
    # the hour — it was that GitHub's scheduler has delivered 0.5h to 11h21m of
    # delay, and a late start cannot be recovered.
    #
    # ── THE ENVELOPE, RE-ATTRIBUTED. THE CANONICAL STATEMENT. ───────────────
    #
    # EVERY DELAY FIGURE CARRIES THE CRON IT WAS MEASURED UNDER. A figure without
    # its regime gets re-pooled within a month; that has already happened twice —
    # once when `0.5h-11h21m` was cited as this cron's envelope, and once when a
    # 09:37 run (`390a4be`) read as an 11h30m outlier of a 03:00 series.
    #
    # Measured 2026-10-02, membership by each run's OWN headSha:
    #
    #   cron           n    min      max      mean     sd        regime
    #   -----------  ---  -------  -------  -------  -------  -----------------
    #   37 9 * * *    39   0h17m   11h21m    1h53m   143.9m   retired 2026-08-30
    #   0 3 * * *     32   4h11m    6h35m    5h03m    36.7m   retired 2026-10-01
    #   0 0 * * *      1   4h15m    4h15m    4h15m      n/a   CURRENT
    #
    # SO `11h21m` BELONGS TO `37 9 * * *` AND TO NOTHING ELSE. The `0 3 * * *`
    # regime's measured maximum was 6h35m — 4h46m below it — and the current
    # cron has n=1, which supports no distributional claim at all. The retrospective
    # reconstruction is what made this visible, and `headSha` membership is why
    # it was possible: without it the three populations are one series with a
    # 143.9-minute sd and no structure.
    #
    # `0.5-5.7h` appears elsewhere in this repository and belongs to the same
    # retired pre-08-30 pool. It is not this cron's envelope either.
    #
    # MEASURED FOR THIS CRON, 2026-10-01, n=32, membership by each run's OWN
    # headSha carrying exactly `0 3 * * *` (which excludes 390a4be, a 09:37 run
    # that would otherwise have read as an 11h30m outlier):
    #
    #   min 4h11m · max 6h35m · mean 5h03m · median 5h02m · sd 36.7m · spread 143m
    #
    # AND IT IS DRIFTING, measured 2026-10-01: a linear fit on the n=32 series
    # gives +2.585 min/day (+18.1 min/week), R^2 = 0.451 — a real trend, noisy.
    # 09-28, 09-29, 09-30 and 10-01 came in at 6h05m, 6h15m, 6h07m and 6h35m,
    # four consecutive days above the prior 28-day maximum of 6h02m. A shift,
    # not an outlier.
    #
    # STAGE 22 (2026-10-01). 03:00 -> 00:00 UTC, and the two numbers the old
    # block asserted were both WRONG. Every figure below is measured on this
    # date and labelled; a number in a comment is `assumed` until re-measured.
    #
    #   earliest kickoff  10:15 UTC, NOT 10:04. Measured over 1666 fixtures in
    #                     the 30 tracked leagues, 2026-08-01..09-20, AFTER
    #                     discarding 419 rows whose match_date carries
    #                     sub-second precision — those are ingestion timestamps,
    #                     not kickoffs, and 10:04 was one of them. Only Sat/Sun
    #                     have morning kickoffs (10:15); Mon-Fri earliest is
    #                     14:30. The binding case is the WEEKEND.
    #   latest kickoff    19:45 UTC, NOT 19:30 (Mon 09-14, Wed 09-16). The
    #                     per-weekday spread is 15 minutes, so a single cron is
    #                     the right instrument for the lower edge.
    #   time to picks     67.4-88.1 min on a FULL card (n=4), mean 76.4, sd 10.2,
    #                     mean+3sd 107.0. The old block assumed "a ~20-minute
    #                     run" and derived a 09:45 start deadline from it. That
    #                     deadline was never measured and was wrong by 3-4x.
    #   settlement        19:45 + 115m match + 120m publication [ASSUMED] = the
    #                     floor is 23:40 on day D. DOES NOT BIND: the MINIMUM
    #                     observed delay is 4h11m, so a 00:00 cron starts no
    #                     earlier than 04:11 and clears the floor by 271 min.
    #                     The publication figure would have to be 511 min rather
    #                     than 120 before it could bind, so it is not worth
    #                     re-measuring.
    #   odds availability unchanged from 2026-08-30 and still non-binding:
    #                     9 of 10 fixtures are priced >=24h before kickoff.
    #
    # SO THE DEADLINE IS A MEASURED 08:28-08:47 UTC (10:15 minus full-card
    # mean+3sd / max), and 03:00 sat 67-85 MINUTES PAST IT. 00:00 restores:
    #
    #   delay max 6h35m      -> start 06:35, picks 08:22, margin +112 min
    #   delay mean+3sd 6h53m -> start 06:53, picks 08:40, margin  +94 min
    #
    # DATE SAFETY, the whole risk of moving across midnight. Execution stays on
    # the SAME calendar day for both crons (00:00 + 11h21m, the largest delay
    # ever documented in ANY regime — it belongs to the retired `37 9 * * *`,
    # ever documented, is 11:21 the same day), and 00:00 has 24h of headroom
    # before a crossing against 03:00's 21h — the move is STRICTLY MORE
    # date-robust. Every clock-derived site was enumerated and none changes:
    # the card's date, the settlement target, the credits period, the run marker
    # (briefings_sent.json, keyed by date.today()), the audit window and
    # max_days_ahead's cutoff. The now-relative ones are invariant because the
    # execution band moves through [04:11, 07:11), which contains ZERO kickoffs
    # in 37,709 tracked rows.
    #
    # WHAT IT DOES NOT FIX: +94 min is consumed by the measured drift around
    # 2026-11-06 (projected, R^2=0.451). That is the trigger for the next
    # decision, and the pipeline split — withdrawn here as unnecessary — is the
    # instrument then. OPS-3 stays open.
    - cron: '0 0 * * *'    # 00:00 UTC (03:00 Sofia)
  workflow_dispatch: # Allow manual trigger

# Serialize runs so a manual dispatch can never write to the DB at the same
# time as the scheduled run — the second queues until the first finishes.
concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  daily-picks:
    runs-on: ubuntu-latest
    # Worst case: 65+15+50+150+60+15 = 355 min. Keep this at or above that sum —
    # GitHub CANCELS the job at the cap rather than failing a step, which loses
    # the whole day silently rather than tripping the failure alert.
    #
    # The national-team (World Cup) history backfill used to run here and then
    # in its own job. Removed 2026-08-07: WC 2026 is over and the next one is
    # four years out, so the coverage probe and the 90-minute backfill were pure
    # overhead on every run. `--backfill-wc` still exists as a CLI command for
    # when qualifiers resume — see docs/production-review-100x.md.
    timeout-minutes: 360

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Claude Pro subscription auth for briefings (claude_code backend, $0 extra).
      # Generate locally with `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Use the secret when configured; otherwise fall back to the explicit
      # dev opt-in so existing CI runs don't break before the secret is added.
      MODEL_HMAC_KEY: ${{ secrets.MODEL_HMAC_KEY }}
      BETTING_AGENT_ALLOW_DEFAULT_HMAC: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # data/models/ also carries match_history.parquet + its metadata — the
      # local mirror of completed-match history. Restoring it here means the
      # seven CLI steps below share one copy AND it survives to tomorrow's run,
      # so each step syncs only the rows whose updated_at moved instead of
      # re-reading the whole history from Supabase. Losing the cache is safe:
      # the first sync just rebuilds the file from scratch.
      - name: Restore ML models + history mirror cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/models/
            data/historical_load_cache.json
          key: betting-models-${{ github.run_number }}
          restore-keys: |
            betting-models-

      - name: Restore camoufox binary cache
        id: restore-camoufox
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            camoufox-${{ runner.os }}-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        env:
          NODE_NO_WARNINGS: 1
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome (stable) and Xvfb
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb xvfb
          google-chrome --version

      - name: Start virtual display (Xvfb)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac 2>/dev/null &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 1
          echo "Virtual display started on :99"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          # Remove GPU libraries pulled as XGBoost transitive deps on CPU-only runner
          pip uninstall -y nvidia-nccl-cu12 2>/dev/null || true
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Download camoufox Firefox binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m camoufox fetch
        continue-on-error: true

      - name: Create directories
        run: mkdir -p data/models logs

      - name: Create config from example
        run: cp config/config.example.yaml config/config.yaml

      - name: Verify database connection
        run: |
          python -c "
          from src.data.database import init_db
          db = init_db()
          assert db.health_check(), 'Database health check failed'
          print('Database connection OK' if db.is_postgres else 'Database connection OK (SQLite fallback)')
          "

      - name: Mark DB tables as created
        run: echo "TABLES_CREATED=1" >> $GITHUB_ENV

      # Stage 12.1, Defect 2: NO continue-on-error here, deliberately.
      # Every other core step keeps it so one scraper hiccup cannot half-abort
      # the pipeline. Tests are different: they gate whether this code is fit to
      # generate picks at all. A failing suite used to leave the job green AND
      # the alert undelivered — a silently broken run. Failing here stops the
      # job before update/settle/picks, which is the correct blast radius: a
      # missed day of picks is recoverable, picks generated from code whose
      # tests fail are not obviously wrong and may never be noticed.
      # BOUNDED 2026-10-01. Until today this step had NO timeout-minutes, so it
      # inherited the 360-minute JOB cap — and a job cancelled at the cap loses
      # the day with no alert, because `always()` steps are not guaranteed a
      # grace period once the job is cancelled. A step-level timeout is a
      # different event: GitHub marks the STEP `failure`, the job halts here (no
      # continue-on-error, deliberately), every step below reports `skipped`, and
      # the critical-step alert — which runs `if: always()` and keys on those
      # downstream outcomes rather than on anything tests-specific — fires with
      # "step(s) DID NOT RUN". That path is not hypothetical: it is exactly what
      # ran on 2026-10-01 when a test FAILED, and a timeout produces the same
      # downstream state.
      #
      # 15 MINUTES = ~7x the measured maximum. The suite runs in 119-130s in CI
      # (n=4, measured 2026-09-28..10-01), so 15 min absorbs the 2-3x variance an
      # unlucky runner produces while cutting an unbounded hang from 360 min to
      # 15. Raise it when the measured baseline moves, not when it trips.
      - name: Run tests
        id: tests
        timeout-minutes: 15
        run: python -m pytest tests/ -v --tb=short

      - name: Run daily update (fixtures + odds, no Flashscore results)
        id: update
        run: python -m src.agent.betting_agent --update --skip-ml-retrain
        timeout-minutes: 65
        continue-on-error: true

      - name: Settle yesterday's predictions
        id: settle1
        run: python -m src.agent.betting_agent --settle
        timeout-minutes: 15
        continue-on-error: true

      - name: Retrain ML models (if stale)
        id: retrain_ml
        run: python -m src.agent.betting_agent --train
        timeout-minutes: 50
        continue-on-error: true

      # `== 'failure'`, NOT `!= 'success'`. On 2026-09-20 the retrain step was
      # SKIPPED (the test step above it failed and halted the job), `skipped`
      # is not `success`, and this delivered "ML training step killed by CI
      # timeout" for a step that never started. The alert names a timeout; the
      # condition must name the outcome a timeout produces. `skipped` is
      # reported by the critical-step alert below as DID NOT RUN.
      - name: Alert on ML training timeout or failure
        if: always() && steps.retrain_ml.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.ci_alert             "⚠️ ML training step killed by CI timeout — model not updated. Raise timeout-minutes or reduce sample target."

      - name: Check DB health
        run: |
          python << 'PYEOF'
          from src.data.database import get_db
          from src.data.models import Match, SavedPick
          db = get_db()
          with db.get_session() as session:
              completed = session.query(Match).filter(Match.home_goals.isnot(None)).count()
              fixtures = session.query(Match).filter(Match.is_fixture == True).count()
              picks = session.query(SavedPick).count()
              pending = session.query(SavedPick).filter(SavedPick.result.is_(None)).count()
          print(f'DB health: {completed} completed matches | {fixtures} fixtures | {picks} total picks ({pending} pending)')
          if completed < 100:
              print('WARNING: fewer than 100 completed matches — ML training may be skipped')
          PYEOF

      # Restore BEFORE picks: get_daily_picks reads the final:<match_id> freeze
      # markers from this file — restoring after picks let a second run
      # regenerate picks behind briefing decisions (only dedup caught it).
      - name: Restore briefings-sent guard
        uses: actions/cache/restore@v5
        with:
          path: data/briefings_sent.json
          key: briefings-sent-${{ github.run_id }}
          restore-keys: |
            briefings-sent-

      # Claude Code CLI must be installed BEFORE picks: the --picks step now runs
      # Claude's per-match review (KEEP/CHANGE) on every pick before sending the
      # summary. No separate briefing step — briefing articles are not posted.
      - name: Install Claude Code CLI (pick review via Pro subscription)
        run: npm install -g @anthropic-ai/claude-code
        continue-on-error: true

      # Scaling this step: analysis is per-fixture and parallelises, but the
      # phase after it (ranking, per-match cap, correlation filter, and the
      # daily `betting.max_total_kelly_pct` exposure cap) is a property of the
      # whole day's slate — four shards each applying a 40% cap would stake
      # 160%. So the split is analyse-then-collect, not run-the-pipeline-N-times:
      #
      #   matrix job i of N:
      #     python -m src.agent.betting_agent --picks --force       #       --shard i/N --out data/candidates/candidates-00i.json
      #     (upload data/candidates/ as an artifact)
      #
      #   collect job (needs: all shards, downloads the artifacts):
      #     python -m src.agent.betting_agent --picks --collect data/candidates
      #
      # `--shard 1/1` is a no-op and behaves exactly like the line below, so a
      # matrix of size 1 needs no collect job. Left single-process here
      # deliberately: at current volume a matrix costs more in runner setup than
      # it saves. See docs/production-review-100x.md (S1-1).
      - name: Generate, review, and send picks
        id: picks
        run: python -m src.agent.betting_agent --picks --force
        timeout-minutes: 150
        continue-on-error: true

      - name: Save briefings-sent guard
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/briefings_sent.json
          key: briefings-sent-${{ github.run_id }}

      - name: Scrape Flashscore results for all leagues (post-picks)
        id: results
        if: always()
        run: python -m src.agent.betting_agent --update-results
        timeout-minutes: 60
        continue-on-error: true

      - name: Settle late results (post update-results)
        id: settle2
        if: always()
        run: python -m src.agent.betting_agent --settle
        timeout-minutes: 15
        continue-on-error: true

      # Loud failure alert: every core step above runs with continue-on-error so
      # the pipeline never half-aborts, but that also keeps the JOB green on a
      # crash — a silent no-pick / no-briefing day. This step inspects each step's
      # outcome and sends ONE Telegram alert if any critical step failed, so a
      # real crash is never invisible.
      #
      # `outcome` IS THREE-VALUED AND WAS READ AS TWO-VALUED (2026-09-20).
      # On run 35498465743 `Run tests` — the one core step with no
      # continue-on-error — failed, so the job halted and every unguarded step
      # below it was SKIPPED. This script tested only `== "failure"`, found
      # none, and printed `All critical steps OK` with picks='skipped'. The step
      # whose entire purpose is to catch "the day produced nothing" reported the
      # day as healthy, and DEL-2 never reached its branch because its predicate
      # names `failure` and the picks step had never run.
      #
      # FAILED and DID NOT RUN are different events with the same consequence,
      # so they are counted apart and alerted together. Anything that is none of
      # success/failure/skipped (`cancelled` at the timeout cap) is reported as
      # itself rather than folded into either.
      - name: Alert on critical step failure
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          O_UPDATE: ${{ steps.update.outcome }}
          O_SETTLE1: ${{ steps.settle1.outcome }}
          O_PICKS: ${{ steps.picks.outcome }}
          O_RESULTS: ${{ steps.results.outcome }}
          O_SETTLE2: ${{ steps.settle2.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os, subprocess, sys
          # `tests` is no longer listed: it has no continue-on-error, so a
          # failure there fails the job outright and this step reports it
          # through the job status rather than as a "stayed green" warning.
          steps = {
              "update": os.environ.get("O_UPDATE", ""),
              "settle (pre-picks)": os.environ.get("O_SETTLE1", ""),
              "picks (incl. review)": os.environ.get("O_PICKS", ""),
              "update-results": os.environ.get("O_RESULTS", ""),
              "settle (post-results)": os.environ.get("O_SETTLE2", ""),
          }
          # THREE STATES, KEPT APART. `skipped` means an earlier unguarded step
          # failed and this one never executed — not that it succeeded.
          failed = [n for n, o in steps.items() if o == "failure"]
          not_run = [n for n, o in steps.items() if o == "skipped"]
          odd = [f"{n}={o!r}" for n, o in steps.items()
                 if o not in ("success", "failure", "skipped")]
          if not (failed or not_run or odd):
              print("All critical steps OK:", steps)
              sys.exit(0)
          parts = []
          if failed:
              parts.append("step(s) FAILED — " + ", ".join(failed))
          if not_run:
              parts.append("step(s) DID NOT RUN — " + ", ".join(not_run))
          if odd:
              parts.append("step(s) in an UNEXPECTED state — " + ", ".join(odd))
          msg = ("⚠️ Daily picks: " + "; ".join(parts)
                 + ". Logs: " + os.environ.get("RUN_URL", ""))
          subprocess.run([sys.executable, "-m", "scripts.ci_alert", msg], check=False)

          # DEL-2 (Stage 14). Narrow by decision: the job goes RED only when
          # pick generation failed.
          #
          # continue-on-error stays on every step, deliberately. Removing it
          # would halt the job at the failure, so --update-results, the second
          # --settle and the cache saves would never run. This changes the run's
          # COLOUR, not its execution.
          #
          # Why only this step: continue-on-error on a scraper absorbs a
          # routine, recoverable failure — Flashscore times out, results arrive
          # tomorrow. On pick generation it converts "the day produced nothing"
          # into a green run. Those were never the same policy; they had the
          # same setting because nobody had separated them.
          #
          # Safe to exit non-zero here: every subsequent step carries
          # `if: always()` (verified, not assumed — including `Save ML models
          # cache`), so a red run still saves its artifacts.
          #
          # THE PREDICATE IS "PRODUCED NO PICKS", NOT "FAILED". A skipped picks
          # step is the same day for the reader — nothing was generated — and
          # it is the state that actually occurred on 2026-09-20 while this
          # script reported the run healthy.
          picks = steps["picks (incl. review)"]
          if picks in ("failure", "skipped"):
              why = ("FAILED" if picks == "failure" else
                     "DID NOT RUN (an earlier unguarded step failed)")
              print(f"::error::Pick generation {why} — no picks were produced "
                    "for today. Failing the job so the run shows red.")
              sys.exit(1)
          EOF

      - name: Send weekly performance report (Sundays only)
        if: always()
        run: |
          if [ "$(date +%w)" = "0" ]; then
            echo "Sunday — sending weekly performance report"
            python -m src.agent.betting_agent --report --no-settle
          else
            echo "Not Sunday (day=$(date +%w)) — skipping weekly report"
          fi
        continue-on-error: true

      - name: Save ML models cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/models/
            data/historical_load_cache.json
          key: betting-models-${{ github.run_number }}

      - name: Save camoufox binary cache
        if: always() && steps.restore-camoufox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

      # Stage 12.1, Defect 2: this step previously had NO `env:` block, so its
      # token was always empty and it had never delivered a single alert.
      - name: Notify Telegram on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.ci_alert             "❌ Daily picks workflow FAILED (run #${{ github.run_number }}). Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
