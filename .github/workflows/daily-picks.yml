name: Daily Betting Picks

on:
  schedule:
    # One daily run. The WC (which forced a 16:00-UTC kickoff deadline and a
    # second "backup" cron to survive GitHub's 0.5-5.7h scheduler delays) is
    # over; club matches kick off in the evening, hours after this ~11:00-UTC
    # run finishes even when the scheduler is late — so a single run has ample
    # buffer and the backup cron was removed (2026-07-22). Off-hour minute
    # dodges top-of-hour congestion. Manual re-runs available via dispatch.
    # STAGE 21. 09:37 -> 03:00 UTC (06:00 Sofia).
    #
    # 09:37 was already near-optimal for a ZERO-delay world: the earliest
    # kickoff in the active league set is 10:04 UTC (Sunday p05 = 10:06), and a
    # ~20-minute run starting at 09:37 finishes before it. The problem was never
    # the hour — it was that GitHub's scheduler has delivered 0.5h to 11h21m of
    # delay, and a late start cannot be recovered.
    #
    # MEASURED 2026-08-30, three constraints, all binding on different sides:
    #
    #   earliest kickoff  run must START by ~09:45 UTC, so a cron at 09:45-D
    #                     tolerates D of delay.
    #   settlement        latest kickoff 19:30 UTC, so football ends ~21:30.
    #                     A cron before ~23:30 the previous day settles matches
    #                     whose results are not yet published.
    #   odds availability measured DIRECTLY against the provider rather than
    #                     from our own first_seen_at (which records when this
    #                     pipeline looked, not when the market opened, and is
    #                     therefore confounded with the delay): 9 of 10 fixtures
    #                     are priced >=24h before kickoff, so odds do not bind.
    #
    # 03:00 tolerates 6h45m of delay -- the whole historical 0.5-5.7h envelope
    # with an hour to spare -- and leaves 5h30m of settlement margin.
    #
    # WHAT IT DOES NOT FIX: a cron at 03:00 delayed 11h lands at 14:00 and still
    # misses a Saturday afternoon card. This buys margin against the TYPICAL
    # delay, not the observed maximum. OPS-3 stays open.
    - cron: '0 3 * * *'    # 03:00 UTC (06:00 Sofia)
  workflow_dispatch: # Allow manual trigger

# Serialize runs so a manual dispatch can never write to the DB at the same
# time as the scheduled run — the second queues until the first finishes.
concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  daily-picks:
    runs-on: ubuntu-latest
    # Worst case: 65+15+50+150+60+15 = 355 min. Keep this at or above that sum —
    # GitHub CANCELS the job at the cap rather than failing a step, which loses
    # the whole day silently rather than tripping the failure alert.
    #
    # The national-team (World Cup) history backfill used to run here and then
    # in its own job. Removed 2026-08-07: WC 2026 is over and the next one is
    # four years out, so the coverage probe and the 90-minute backfill were pure
    # overhead on every run. `--backfill-wc` still exists as a CLI command for
    # when qualifiers resume — see docs/production-review-100x.md.
    timeout-minutes: 360

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Claude Pro subscription auth for briefings (claude_code backend, $0 extra).
      # Generate locally with `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Use the secret when configured; otherwise fall back to the explicit
      # dev opt-in so existing CI runs don't break before the secret is added.
      MODEL_HMAC_KEY: ${{ secrets.MODEL_HMAC_KEY }}
      BETTING_AGENT_ALLOW_DEFAULT_HMAC: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # data/models/ also carries match_history.parquet + its metadata — the
      # local mirror of completed-match history. Restoring it here means the
      # seven CLI steps below share one copy AND it survives to tomorrow's run,
      # so each step syncs only the rows whose updated_at moved instead of
      # re-reading the whole history from Supabase. Losing the cache is safe:
      # the first sync just rebuilds the file from scratch.
      - name: Restore ML models + history mirror cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/models/
            data/historical_load_cache.json
          key: betting-models-${{ github.run_number }}
          restore-keys: |
            betting-models-

      - name: Restore camoufox binary cache
        id: restore-camoufox
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            camoufox-${{ runner.os }}-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        env:
          NODE_NO_WARNINGS: 1
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome (stable) and Xvfb
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb xvfb
          google-chrome --version

      - name: Start virtual display (Xvfb)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac 2>/dev/null &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 1
          echo "Virtual display started on :99"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Remove GPU libraries pulled as XGBoost transitive deps on CPU-only runner
          pip uninstall -y nvidia-nccl-cu12 2>/dev/null || true
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Download camoufox Firefox binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m camoufox fetch
        continue-on-error: true

      - name: Create directories
        run: mkdir -p data/models logs

      - name: Create config from example
        run: cp config/config.example.yaml config/config.yaml

      - name: Verify database connection
        run: |
          python -c "
          from src.data.database import init_db
          db = init_db()
          assert db.health_check(), 'Database health check failed'
          print('Database connection OK' if db.is_postgres else 'Database connection OK (SQLite fallback)')
          "

      - name: Mark DB tables as created
        run: echo "TABLES_CREATED=1" >> $GITHUB_ENV

      # Stage 12.1, Defect 2: NO continue-on-error here, deliberately.
      # Every other core step keeps it so one scraper hiccup cannot half-abort
      # the pipeline. Tests are different: they gate whether this code is fit to
      # generate picks at all. A failing suite used to leave the job green AND
      # the alert undelivered — a silently broken run. Failing here stops the
      # job before update/settle/picks, which is the correct blast radius: a
      # missed day of picks is recoverable, picks generated from code whose
      # tests fail are not obviously wrong and may never be noticed.
      - name: Run tests
        id: tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run daily update (fixtures + odds, no Flashscore results)
        id: update
        run: python -m src.agent.betting_agent --update --skip-ml-retrain
        timeout-minutes: 65
        continue-on-error: true

      - name: Settle yesterday's predictions
        id: settle1
        run: python -m src.agent.betting_agent --settle
        timeout-minutes: 15
        continue-on-error: true

      - name: Retrain ML models (if stale)
        id: retrain_ml
        run: python -m src.agent.betting_agent --train
        timeout-minutes: 50
        continue-on-error: true

      - name: Alert on ML training timeout or failure
        if: always() && steps.retrain_ml.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.ci_alert             "⚠️ ML training step killed by CI timeout — model not updated. Raise timeout-minutes or reduce sample target."

      - name: Check DB health
        run: |
          python << 'PYEOF'
          from src.data.database import get_db
          from src.data.models import Match, SavedPick
          db = get_db()
          with db.get_session() as session:
              completed = session.query(Match).filter(Match.home_goals.isnot(None)).count()
              fixtures = session.query(Match).filter(Match.is_fixture == True).count()
              picks = session.query(SavedPick).count()
              pending = session.query(SavedPick).filter(SavedPick.result.is_(None)).count()
          print(f'DB health: {completed} completed matches | {fixtures} fixtures | {picks} total picks ({pending} pending)')
          if completed < 100:
              print('WARNING: fewer than 100 completed matches — ML training may be skipped')
          PYEOF

      # Restore BEFORE picks: get_daily_picks reads the final:<match_id> freeze
      # markers from this file — restoring after picks let a second run
      # regenerate picks behind briefing decisions (only dedup caught it).
      - name: Restore briefings-sent guard
        uses: actions/cache/restore@v5
        with:
          path: data/briefings_sent.json
          key: briefings-sent-${{ github.run_id }}
          restore-keys: |
            briefings-sent-

      # Claude Code CLI must be installed BEFORE picks: the --picks step now runs
      # Claude's per-match review (KEEP/CHANGE) on every pick before sending the
      # summary. No separate briefing step — briefing articles are not posted.
      - name: Install Claude Code CLI (pick review via Pro subscription)
        run: npm install -g @anthropic-ai/claude-code
        continue-on-error: true

      # Scaling this step: analysis is per-fixture and parallelises, but the
      # phase after it (ranking, per-match cap, correlation filter, and the
      # daily `betting.max_total_kelly_pct` exposure cap) is a property of the
      # whole day's slate — four shards each applying a 40% cap would stake
      # 160%. So the split is analyse-then-collect, not run-the-pipeline-N-times:
      #
      #   matrix job i of N:
      #     python -m src.agent.betting_agent --picks --force       #       --shard i/N --out data/candidates/candidates-00i.json
      #     (upload data/candidates/ as an artifact)
      #
      #   collect job (needs: all shards, downloads the artifacts):
      #     python -m src.agent.betting_agent --picks --collect data/candidates
      #
      # `--shard 1/1` is a no-op and behaves exactly like the line below, so a
      # matrix of size 1 needs no collect job. Left single-process here
      # deliberately: at current volume a matrix costs more in runner setup than
      # it saves. See docs/production-review-100x.md (S1-1).
      - name: Generate, review, and send picks
        id: picks
        run: python -m src.agent.betting_agent --picks --force
        timeout-minutes: 150
        continue-on-error: true

      - name: Save briefings-sent guard
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/briefings_sent.json
          key: briefings-sent-${{ github.run_id }}

      - name: Scrape Flashscore results for all leagues (post-picks)
        id: results
        if: always()
        run: python -m src.agent.betting_agent --update-results
        timeout-minutes: 60
        continue-on-error: true

      - name: Settle late results (post update-results)
        id: settle2
        if: always()
        run: python -m src.agent.betting_agent --settle
        timeout-minutes: 15
        continue-on-error: true

      # Loud failure alert: every core step above runs with continue-on-error so
      # the pipeline never half-aborts, but that also keeps the JOB green on a
      # crash — a silent no-pick / no-briefing day. This step inspects each step's
      # outcome and sends ONE Telegram alert if any critical step failed, so a
      # real crash is never invisible.
      - name: Alert on critical step failure
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          O_UPDATE: ${{ steps.update.outcome }}
          O_SETTLE1: ${{ steps.settle1.outcome }}
          O_PICKS: ${{ steps.picks.outcome }}
          O_RESULTS: ${{ steps.results.outcome }}
          O_SETTLE2: ${{ steps.settle2.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os, subprocess, sys
          # `tests` is no longer listed: it has no continue-on-error, so a
          # failure there fails the job outright and this step reports it
          # through the job status rather than as a "stayed green" warning.
          steps = {
              "update": os.environ.get("O_UPDATE", ""),
              "settle (pre-picks)": os.environ.get("O_SETTLE1", ""),
              "picks (incl. review)": os.environ.get("O_PICKS", ""),
              "update-results": os.environ.get("O_RESULTS", ""),
              "settle (post-results)": os.environ.get("O_SETTLE2", ""),
          }
          failed = [n for n, o in steps.items() if o == "failure"]
          if not failed:
              print("All critical steps OK:", steps)
              sys.exit(0)
          msg = ("⚠️ Daily picks: step(s) FAILED — " + ", ".join(failed)
                 + ". Logs: " + os.environ.get("RUN_URL", ""))
          subprocess.run([sys.executable, "-m", "scripts.ci_alert", msg], check=False)

          # DEL-2 (Stage 14). Narrow by decision: the job goes RED only when
          # pick generation failed.
          #
          # continue-on-error stays on every step, deliberately. Removing it
          # would halt the job at the failure, so --update-results, the second
          # --settle and the cache saves would never run. This changes the run's
          # COLOUR, not its execution.
          #
          # Why only this step: continue-on-error on a scraper absorbs a
          # routine, recoverable failure — Flashscore times out, results arrive
          # tomorrow. On pick generation it converts "the day produced nothing"
          # into a green run. Those were never the same policy; they had the
          # same setting because nobody had separated them.
          #
          # Safe to exit non-zero here: every subsequent step carries
          # `if: always()` (verified, not assumed — including `Save ML models
          # cache`), so a red run still saves its artifacts.
          if steps["picks (incl. review)"] == "failure":
              print("::error::Pick generation FAILED — no picks were produced "
                    "for today. Failing the job so the run shows red.")
              sys.exit(1)
          EOF

      - name: Send weekly performance report (Sundays only)
        if: always()
        run: |
          if [ "$(date +%w)" = "0" ]; then
            echo "Sunday — sending weekly performance report"
            python -m src.agent.betting_agent --report --no-settle
          else
            echo "Not Sunday (day=$(date +%w)) — skipping weekly report"
          fi
        continue-on-error: true

      - name: Save ML models cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/models/
            data/historical_load_cache.json
          key: betting-models-${{ github.run_number }}

      - name: Save camoufox binary cache
        if: always() && steps.restore-camoufox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

      # Stage 12.1, Defect 2: this step previously had NO `env:` block, so its
      # token was always empty and it had never delivered a single alert.
      - name: Notify Telegram on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.ci_alert             "❌ Daily picks workflow FAILED (run #${{ github.run_number }}). Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
