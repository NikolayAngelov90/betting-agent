name: CI Audit

# WHY THIS EXISTS. `scripts/ci_audit.py` has been invoked only by hand since it
# was written. On 2026-09-25 that was measured: Flashscore created zero fixtures
# for four consecutive days, every run reported `success`, and the per-source
# discovery assertion — the one written after Flashscore's 88-day silent death —
# fired correctly but into a terminal nobody was reading.
#
#     An alarm with no wire to production is a definition, not an alarm.
#
# WHY A SEPARATE RUN AND NOT A STEP. `gh run view --log` returns nothing until a
# run completes, so a workflow cannot audit itself from the inside. This is not
# a preference; it is why the step could not be added to daily-picks.
#
# WHY `workflow_run` AND NOT A CRON. daily-picks fires at 03:00 and has landed
# between 07:56 and 08:20, but GitHub's scheduler has delivered 0.5h to 11h21m UNDER THE RETIRED `37 9 * * *` CRON (n=39)
# of delay (OPS-3). Any fixed hour is a guess that a late run defeats;
# `workflow_run: completed` fires exactly when the log becomes readable. The
# daily cron below is a backstop for a `workflow_run` event that is dropped.

on:
  workflow_run:
    workflows:
      - Daily Betting Picks
      - Closing Line Capture
      - Paper Trading Report
    types: [completed]
  schedule:
    # Backstop only. 12:00 UTC is after daily-picks' observed completion window
    # with margin; a run delayed past it is picked up by the next day's pass,
    # because `--unaudited` keys on the ledger and not on a time window.
    - cron: '0 12 * * *'
  workflow_dispatch:

# One audit at a time. Three workflows completing within minutes of each other
# would otherwise run three passes over the same unaudited set.
concurrency:
  group: ci-audit
  cancel-in-progress: false

permissions:
  contents: read
  actions: read          # `gh run view --log` needs this and nothing more

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # FULL HISTORY. The series' membership rule reads the cron FROM EACH
          # RUN'S OWN headSha (`git show <sha>:...`), which is how two schedule
          # regimes are kept from pooling. `fetch-depth: 1` makes every sha but
          # HEAD unreadable, and the rule then silently over-excludes: measured
          # 2026-10-11, the whole series read `UNEVALUATED: no runs under the
          # current cron yet`. It had looked healthy for weeks only because
          # every run in the window shared the then-HEAD sha.
          fetch-depth: 0
        # The ledger IS the history. `produced_recently()` reads
        # `docs/ci-audit-ledger.md`, so a shallow checkout of the default branch
        # is both necessary and sufficient.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        # No pip install: ci_audit imports the standard library only.

      - name: Audit unaudited runs
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
          AUDIT_ALERT_BODY: ${{ runner.temp }}/audit_alert.txt
          # THE DAY-AHEAD DEADLINE, AND IT IS STILL stdlib-ONLY.
          #
          # The prospective margin for TOMORROW needs tomorrow's earliest
          # kickoff, which our own `matches` has never held: max observed
          # fixture lead 23.62h against a 24-28h requirement. It used to live
          # in the Flashscore probe, disabled 2026-10-18 after 240 page-loads
          # produced zero deadlines, so nothing computed it from then until
          # this line.
          #
          # football-data.org answers `/matches?date=D+1` over ONE stdlib
          # HTTPS GET -- no database, no psycopg2, no SQLAlchemy, no pip
          # install -- on a free tier of 10 calls/minute with NO DAILY LIMIT.
          # Absent, the deadline falls to the conservative constant and the
          # report says `NOT reference-verified` rather than going quiet.
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        # THE POLICY, STATED RATHER THAN INHERITED.
        #
        # `--fail-on BROKEN,DID_NOT_RUN` and NOT DEGRADED. DEGRADED is this
        # pipeline's ordinary state — eight implausible-attribution rows on
        # every daily-picks run — and failing on it would make red mean nothing,
        # which is the noise DEL-2 was deliberately narrowed to avoid. BROKEN
        # and DID_NOT_RUN say the pipeline did not do its job, which is the same
        # axis DEL-2 chose for the picks step.
        #
        # So: this job REPORTS everything and goes RED only when a run crashed
        # or did not execute. A DEGRADED finding still reaches Telegram below.
        #
        # `--since`, NOT `--unaudited`. Measured 2026-09-26, three days after
        # this workflow shipped: 8 of 8 triggers alarmed, and every one named
        # the SAME two run ids — 36055130676 and 36074834054, the two psycopg
        # failures of 09-24 that the sqlalchemy pin had already fixed.
        #
        #     Firing rate 100%. Distinct conditions: 1. Actionable: 0.
        #
        # `--unaudited` means "every run with no ledger row", and this workflow
        # does not WRITE ledger rows — only the manual pass does. So a
        # remediated historical failure stays in scope forever and the alarm can
        # never clear by itself. Eight identical Telegram alerts in three days,
        # which is `fixtures_zero_active` for the fourth time: a check that
        # cries wolf until it is ignored, reaching that state in three days.
        #
        # A windowed scope ages a fixed failure out on its own. The two jobs are
        # different and now have different scopes:
        #
        #     alarm on what is RECENT      --since  (here)
        #     record EVERYTHING once       --unaudited  (the manual pass)
        run: |
          # `python -m`, matching `ci_alert` in this same job. The script
          # form puts `scripts/` on sys.path[0] instead of the repo root,
          # which broke a module-level `scripts.` import on 2026-10-10 and
          # cost three reds and ~13h of unaudited runs. `ci_audit.py` now
          # also bootstraps sys.path itself, so BOTH forms work and this
          # line is belt to that braces rather than the only defence.
          set +e
          python -m scripts.ci_audit \
            --since "$(date -u -d 'yesterday' +%Y-%m-%d)" \
            --fail-on BROKEN,DID_NOT_RUN
          code=$?
          set -e
          echo "audit_exit=$code" >> "$GITHUB_OUTPUT"
          exit $code
        continue-on-error: true

      - name: Alert on an audit finding
        # `always()` so a crash in the audit itself is not silence. The alert
        # fires on ANY non-success, including DEGRADED, because reporting and
        # failing are separated above: red is narrow, the alert is not.
        if: always() && steps.audit.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
          BODY_FILE: ${{ runner.temp }}/audit_alert.txt
        # THE REASONS, NOT A GUESS AT THEM. The fixed sentence that stood here
        # named BROKEN and DID_NOT_RUN; on 2026-10-12 the alarm was
        # `schedule margin -85m < 30m`, which is neither.
        run: |
          # ── AN EMPTY BODY NOW MEANS "DO NOT SEND". 2026-10-22. ────────────
          #
          # This branch used to send "(!) CI audit exited non-zero with NO
          # alarm list written - treat as MACHINERY, not a finding." on an
          # empty body. Two things changed and both point the same way:
          #
          #   1. MACHINERY IS RUN STATUS. "the audit crashed" is this run's
          #      conclusion; the `::error::CI AUDIT CRASHED` annotation and
          #      GitHub's notification on the red run carry it, and neither
          #      needs a phone.
          #   2. AN EMPTY BODY IS NO LONGER RARE. `_write_alarm_body` writes
          #      only the ACTIONABLE alarms, so "every alarm this run raised
          #      restated a run's own conclusion" now writes an empty file.
          #      MEASURED over a 30-run sample of real alarming runs: with the
          #      standing margin acknowledged, 21 of 30 write nothing. Keeping
          #      the fallback would have converted the whole saving into a
          #      daily "NO alarm list written" message -- strictly worse than
          #      before, because that text names nothing at all.
          #
          # So the send is conditional, and the skip is announced in the log.
          if [ -s "$BODY_FILE" ]; then
            python -m scripts.ci_alert "(!) $(cat "$BODY_FILE")
          Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "No actionable alarm body: NOTHING SENT to Telegram."
            echo "Either every alarm this run raised restates a run's own"
            echo "conclusion, or the audit crashed before writing one. Both"
            echo "are carried by this run's red and GitHub's notification."
          fi

      - name: Fail the job when the audit alarmed
        # Separated from the audit step so the alert above always gets to run
        # first. A red run whose alert never sent is the shape Stage 12.1 found.
        if: always() && steps.audit.outcome == 'failure'
        run: |
          # EXIT 2 IS A CRASH, EXIT 1 IS A FINDING. Reporting a crash as
          # "alarmed - see the audit step for the run ids" is what happened
          # on 2026-10-10: there were no run ids, and the message invited
          # the reader to look for findings that did not exist.
          if [ "${{ steps.audit.outputs.audit_exit }}" = "2" ]; then
            echo "::error::CI AUDIT CRASHED - this is MACHINERY, not a finding. NOTHING was audited by this run, and nothing has been audited since the last run that exited 0 or 1. Do not read the absence of findings as a clean bill."
          else
            echo "::error::CI audit alarmed - see the audit step for the run ids."
          fi
          exit 1
